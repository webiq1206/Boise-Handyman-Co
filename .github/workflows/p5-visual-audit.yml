name: P5 visual audit pilot
on:
  push:
    branches: [codex/p5-visual-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/p5-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-visual-results
          path: p5-visual-results/
          retention-days: 7
