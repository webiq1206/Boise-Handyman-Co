name: P5 final linked-page and visible-image verification
on:
  push:
    branches: [codex/p5-cabinet-triage]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        width: [320,390,430,768,1024,1440,1920]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false @playwright/test@1.60.0
      - run: node scripts/p5-final-triage.mjs
        env:
          AUDIT_WIDTH: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-triage-${{ matrix.width }}
          path: p5-triage
          retention-days: 7
