name: P5 parent final live verification
on:
  push:
    branches: [codex/p5-parent-published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/p5-parent-published.mjs
        env:
          P5_PARENT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-parent-published
          path: p5-verification/
          retention-days: 14
